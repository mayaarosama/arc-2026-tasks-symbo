# Conductor configuration — the single place where the run of show and the settings matrix live.
# Every value marked TBC is a starting point that the rehearsal pass replaces.
#
# SINGLE-MODEL SHOW: one model per task, the same on every machine, each chosen because it runs on
# a CPU *and* on a CUDA GPU (SF3D needs >= 6 GB VRAM; SD 1.5 and Stable Audio Small fit in 4 GB):
#   t2i  sd15             SD 1.5               stable-diffusion-v1-5/stable-diffusion-v1-5
#   i23d sf3d             Stable Fast 3D       stabilityai/stable-fast-3d
#   music sa3-small-music Stable Audio 3 Small stabilityai/stable-audio-3-small-music
#   llm  qwen35-4b        Qwen3.5 4B Q4_K_M    bartowski/Qwen_Qwen3.5-4B-GGUF (llama.cpp)
#   layout qwen35-4b-layout  the same file, placing furniture (Task 8, backends/layout.py)
# The machines differ only in how much they finish (batch, steps, tracks in the budget).
# The larger per-machine models (SD 3.5, TRELLIS, Stable Audio Medium) are in config/demo-full.yaml.

session_dir: session          # live outputs + runs.jsonl for this show
replay_dir: replay            # rehearsal outputs used for REPLAY cells
token_env: ARC_DEMO_TOKEN     # shared secret sent to workers (X-Demo-Token); unset = no auth

# Seconds after the budget before a silent worker is treated as failed and REPLAY engages.
timeout_grace_seconds: 15
# A worker that cannot be polled for this long is treated as unreachable.
unreachable_after_seconds: 6

# "Load this task's model" first unloads every other task's model on every machine, so only the
# chosen task is in RAM / VRAM. A machine with  keep_other_tasks: true  keeps them loaded.
machines:
  - id: dgx
    label: "DGX H200"
    hardware: "8× H200 · 141 GB each (TBC)"
    color: "#76b900"
    workers:
      t2i: http://dgx.local:8101
      i23d: http://dgx.local:8102
      music: http://dgx.local:8103
      llm: http://dgx.local:8104
      layout: http://dgx.local:8105
  - id: workstation
    label: "Workstation"
    hardware: "1 GPU · 16 GB VRAM"
    color: "#4aa8ff"
    workers:
      t2i: http://workstation.local:8101
      i23d: http://workstation.local:8102
      music: http://workstation.local:8103
      llm: http://workstation.local:8104
      layout: http://workstation.local:8105
  - id: cpu
    label: "CPU only"
    hardware: "No GPU · 16 GB RAM"
    color: "#f0a640"
    show_full_recording: true  # time up / stopped / down: show the full rehearsal run + its time
    workers:
      t2i: http://cpu.local:8101
      i23d: http://cpu.local:8102
      music: http://cpu.local:8103
      llm: http://cpu.local:8104
      layout: http://cpu.local:8105

inputs:
  t2i: data/t2i/stage_prompts.json
  i23d: data/i23d/stage_objects.json
  music: data/music/stage_inputs.json
  llm: data/llm/stage_prompts.json
  layout: data/layout/stage_rooms.json

# ------------------------------------------------------------------------------------------
# Settings matrix. "all" applies to every machine; a machine key overrides it.
# mode: live | replay  (replay = always serve the rehearsal record, badged REPLAY)
# ------------------------------------------------------------------------------------------
settings:
  t2i:
    iso_quality:   # identical everywhere: same seed -> same image, only the clock differs
      all: {model: sd15, width: 512, height: 512, steps: 25, guidance: 7.5, batch: 8}
    iso_time:      # every machine is asked for the same images, size and steps; only what finishes differs
      keep_for_any_model: [width, height, steps]   # a picked model keeps these (not its model_choices ones)
      all:         {model: sd15, width: 512, height: 512, steps: 30, guidance: 7.5, batch: 4}
  i23d:
    iso_time:
      all:         {model: sf3d, texture_size: 1024}
      cpu:         {model: sf3d, texture_size: 512, mode: live}   # measure before assuming replay
  music:
    iso_time:      # throughput: complete 30 s tracks finished inside the budget
      all:         {model: sa3-small-music, length_s: 30, steps: 8, repeat_until_budget: true}
  llm:            # one model everywhere; machines differ in how many replies they serve at once (TBC)
    iso_quality:   # the stopwatch: one greedy reply, identical on every machine
      all:         {model: qwen35-4b, streams: 1, max_tokens: 256, temperature: 0}
    iso_time:      # throughput: concurrent replies, total tokens generated inside the budget
      all:         {model: qwen35-4b, max_tokens: 512, temperature: 0.7, repeat_until_budget: true}
      dgx:         {model: qwen35-4b, streams: 64}
      workstation: {model: qwen35-4b, streams: 8}
      cpu:         {model: qwen35-4b, streams: 1}

  layout:         # task 8: the Task 4 model placing furniture; one model everywhere (TBC from rehearsal)
    iso_quality:   # the same room on every machine (greedy), built object by object; compare the time
      all:         {model: qwen35-4b-layout, streams: 1, max_tokens: 400, temperature: 0}
    iso_quality+fix:   # seg8b: the same, and the model fixes its own mistakes (repair each flagged line at
                       # once, up to 2 tries; then up to 3 review rounds of move/remove on the finished room)
      all:         {model: qwen35-4b-layout, streams: 1, max_tokens: 400, temperature: 0, repairs: 2, review_rounds: 3}
    iso_quality+layoutgpt:   # seg8c: the same model and rooms with LayoutGPT's published prompt (CSS lines, the
                             # room given only as its size, 4 similar example rooms). Lines are ~60 tokens.
      all:         {model: qwen35-4b-layout, streams: 1, max_tokens: 800, temperature: 0, layout_prompt: layoutgpt}
    iso_time:      # throughput: rooms furnished at once, repeated until the bell
      all:         {model: qwen35-4b-layout, max_tokens: 400, temperature: 0.7, repeat_until_budget: true}
      dgx:         {model: qwen35-4b-layout, streams: 64}
      workstation: {model: qwen35-4b-layout, streams: 8}
      cpu:         {model: qwen35-4b-layout, streams: 1}

# ------------------------------------------------------------------------------------------
# Model choices. The operator page ("What will run" > AI model) has one dropdown per machine:
# the model planned above, or any model listed here for that task. A pick holds for every part
# of that task until changed back, and survives a conductor restart (session_dir/model_picks.json).
# Each entry holds only what that model needs (resolution, guidance...); the protocol's keys
# (batch, streams, temperature, steps per machine) stay as planned above.
# These weights are NOT downloaded for demo.yaml: a model offered here only loads on a machine
# whose setup also ran demo-full.yaml (setup_gpu_machine.sh does both). Otherwise "Load the AI
# model" reports the error. No recording exists for a picked model, so there is no REPLAY fallback.
# ------------------------------------------------------------------------------------------
model_choices:
  t2i:
    sd15:               {width: 512,  height: 512,  guidance: 7.5}
    sd35-medium-not5:   {width: 1024, height: 1024, guidance: 4.5}
    sd35-medium-t5int8: {width: 1024, height: 1024, guidance: 4.5}
    sd35-large:         {width: 1024, height: 1024, guidance: 4.5}   # DGX only
  i23d:
    sf3d:                {texture_size: 1024}
    trellis-image-large: {ss_steps: 12, slat_steps: 12, texture_size: 1024}
    trellis2-4b:         {resolution: 1024, texture_size: 2048, decimation: 300000}   # ~24 GB: DGX
  music:
    sa3-small-music: {}
    sa3-medium: {}             # needs flash-attn 2 (DGX, workstation)
  llm:
    qwen35-4b: {}
    qwen35-9b: {}
    qwen35-122b-a10b: {}       # DGX only
  layout:
    qwen35-4b-layout: {}
    qwen35-9b-layout: {}
    qwen38-27b-layout: {}      # 13.4 GB: the workstation alone, nothing else on the GPU
    qwen35-122b-a10b-layout: {}   # DGX only

# ------------------------------------------------------------------------------------------
# Run of show. The operator page shows these as buttons, in order.
# ------------------------------------------------------------------------------------------
segments:
  - id: seg0
    title: "Three machines, one task"
    task: t2i
    protocol: iso_time
    budget_seconds: 60
    inputs: [t2i-01]
    warmup: true
    caption: "Warm-up run. Same prompt, same seed, three machines."
  - id: seg1
    title: "The stopwatch"
    task: t2i
    protocol: iso_quality
    budget_seconds: null           # no cutoff: every machine runs to completion
    inputs: [t2i-01]
    caption: "Identical model, settings and seed on every machine. Only the clock differs."
  - id: seg2
    title: "Same minute, different results"
    task: t2i
    protocol: iso_time
    budget_seconds: 60             # TBC from rehearsal: 30–60 s
    inputs: [t2i-01, t2i-02, t2i-03]
    caption: "Same model on every machine. Each did as much as it could finish in {budget} seconds."
  - id: seg3
    title: "The same test in 3D"
    task: i23d
    protocol: iso_time
    budget_seconds: 60
    inputs: [i23d-01, i23d-02, i23d-03]
    caption: "Same 3D model on every machine, {budget} seconds each. Error is measured against the scanned object."
  - id: seg6                       # task 4: language model race
    title: "Same answer, different time"
    task: llm
    protocol: iso_quality
    budget_seconds: null
    inputs: [llm-01]
    caption: "Same model, same prompt, greedy decoding on every machine. Only the clock differs."
  - id: seg7
    title: "Tokens in a minute"
    task: llm
    protocol: iso_time
    budget_seconds: 60
    inputs: [llm-02, llm-03]
    caption: "Same model on every machine, each serving as many replies at once as it handles well. Total tokens in {budget} seconds."
  - id: seg8                       # task 8: sequential scene construction (LLM layout)
    title: "Furnish the room"
    task: layout
    protocol: iso_quality
    budget_seconds: null
    inputs: [lay-01, lay-02, lay-03]
    caption: "Same model, same floor plan, greedy decoding: every machine builds the same room, one object at a time. Only the clock differs."
  - id: seg8c                      # task 8 with LayoutGPT's published prompt, for comparison
    title: "The published method"
    task: layout
    protocol: iso_quality+layoutgpt
    budget_seconds: null
    inputs: [lay-01, lay-02, lay-03]
    caption: "The same model with LayoutGPT's prompt (NeurIPS 2023): each piece as a line of sizes and coordinates, the room given only as its size, plus four similar example rooms. Compare with Furnish the room."
  - id: seg8b                      # task 8 with self-correction: the model fixes what the room checks flag
    title: "Furnish and fix"
    task: layout
    protocol: iso_quality+fix
    budget_seconds: null
    inputs: [lay-01, lay-02, lay-03]
    caption: "Same room, but now every mistake is sent back: the model rewrites a flagged piece at once, then reviews the finished room and moves what still clashes. Every fix is the model's own; red turns green."
  - id: seg9
    title: "Rooms in a minute"
    task: layout
    protocol: iso_time
    budget_seconds: 60
    inputs: [lay-02]
    caption: "Same model on every machine, each furnishing as many rooms at once as it handles well. Rooms finished in {budget} seconds."
