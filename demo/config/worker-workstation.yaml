# Worker config for the 16 GB workstation. Only ONE task's model fits in VRAM at a time:
# the conductor's "Prepare" step unloads the other task before loading this one.
machine: workstation
results_dir: results
mock: false
devices:
  t2i: [cuda:0]
  i23d: [cuda:0]
  music: [cuda:0]
micro_batch: 1
exclusive_models: true   # loading a model first unloads any other in this worker
preload:               # single-model show (demo.yaml). Full matrix (demo-full.yaml): t2i [sd35-medium-t5int8]
  t2i: [sd15]
  i23d: []              # loaded on "Prepare segment 3", after t2i is unloaded
  music: []
