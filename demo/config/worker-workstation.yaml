# Worker config for the 16 GB workstation. Only ONE task's model fits in VRAM at a time:
# the conductor's "Prepare" step unloads the other task before loading this one.
machine: workstation
results_dir: results
mock: false
devices:
  t2i: [cuda:0]
  i23d: [cuda:0]
  music: [cuda:0]
  llm: [cuda:0]
  layout: [cuda:0]    # the same llama-server path as llm
micro_batch: 1
exclusive_models: true   # loading a model first unloads any other in this worker
preload:               # nothing in VRAM until a task's "Prepare" (load time never enters the clock anyway)
  t2i: []               # loaded on "Prepare segment 1"
  i23d: []              # loaded on "Prepare segment 3", after t2i is unloaded
  music: []
  llm: []               # loaded on "Prepare" of the llm segments
  layout: []
llama_server: third_party/llama.cpp/bin/llama-server   # the same llama.cpp release on every machine
llm_slots: 8
