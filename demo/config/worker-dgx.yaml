# Worker config for the DGX H200. One worker process per task (separate Python envs):
#   t2i : python -m arcdemo.worker --config config/worker-dgx.yaml --task t2i  --port 8101
#   i23d: python -m arcdemo.worker --config config/worker-dgx.yaml --task i23d --port 8102
#   music: python -m arcdemo.worker --config config/worker-dgx.yaml --task music --port 8103
machine: dgx
results_dir: results
mock: false
devices:
  t2i: [cuda:0, cuda:1, cuda:2, cuda:3, cuda:4, cuda:5, cuda:6, cuda:7]   # TBC: GPU count
  i23d: [cuda:0]        # one mesh does not split across GPUs; resolution is the dial
  music: [cuda:0]
micro_batch: 1          # images per forward pass per device (batch 8 over 8 GPUs = 1 each)
preload:                # loaded at service start so load time never enters a clock
  t2i: [sd15]           # single-model show (demo.yaml). Full matrix (demo-full.yaml): [sd35-large]
  i23d: [sf3d]          #                                                             [trellis2-4b]
  music: [sa3-small-music]  #                                                         [sa3-medium]
